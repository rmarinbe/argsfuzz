name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build .pyz release
        run: |
          cp argsfuzz-schema.json argsfuzz/argsfuzz-schema.json
          python -m zipapp argsfuzz -o argsfuzz.pyz -p "/usr/bin/env python3"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: argsfuzz.pyz
          generate_release_notes: true
